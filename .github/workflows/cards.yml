name: Update Profile Cards

on:
  schedule:
    - cron: "0 */6 * * *"   # har 6 ghante baad
  workflow_dispatch:         # manually run karne ke liye
  push:
    paths:
      - ".github/scripts/generate_cards.py"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate activity graph and trophies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python .github/scripts/generate_cards.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || git commit -m "chore: update profile cards"
          git push
